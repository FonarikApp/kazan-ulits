# Source: project.godot in repo root, or zip parts (Kazan_*.zip); legacy: sort -V picks newest Kazan_Ulitsy_v*.zip
name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.2.2"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract game source
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "project.godot" ]; then
            PROJECT_PATH="."
          else
            mkdir -p unpacked
            COUNT=0
            for Z in Kazan_*.zip; do
              [ -f "$Z" ] || continue
              echo "Unpacking $Z"
              unzip -q -o "$Z" -d unpacked
              COUNT=$((COUNT+1))
            done
            if [ "$COUNT" -eq 0 ]; then
              echo "ERROR: no project.godot and no Kazan_*.zip files found."
              ls -lah
              exit 1
            fi
            PROJECT_FILE="$(find unpacked -type f -name project.godot -print -quit)"
            if [ -z "$PROJECT_FILE" ]; then
              echo "ERROR: project.godot not found inside the zip parts."
              exit 1
            fi
            PROJECT_PATH="$(dirname "$PROJECT_FILE")"
          fi
          mkdir -p "$PROJECT_PATH/.github/workflows"
          cp .github/workflows/android.yml "$PROJECT_PATH/.github/workflows/android.yml" 2>/dev/null || true
          echo "PROJECT_DIR=$PROJECT_PATH" >> "$GITHUB_ENV"
          echo "project_dir=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          echo "Godot project: $PROJECT_PATH"

      - name: Install Godot and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          TDIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TDIR"
          unzip -q -j templates.tpz 'templates/android_*' 'templates/version.txt' -d "$TDIR"
          ls -lh "$TDIR"
          godot --version

      - name: Set up Android SDK, Java and debug keystore
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          JAVA="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          echo "Android SDK: $SDK"
          echo "Java: $JAVA"
          SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "build-tools;33.0.2" "platforms;android-33" "cmdline-tools;latest" >/dev/null
          "$JAVA/bin/keytool" -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Validate story and release data
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 tests/validate_story.py
          python3 tests/validate_release.py
          test -s assets/audio/dj_groove_titry.ogg
          test -s export_presets.cfg
          grep -q '^platform="Android"$' export_presets.cfg

      - name: Import Godot project and check scripts
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p build
          set +e
          godot --headless --editor --path . --import 2>&1 | tee build/import.log
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          if grep -E 'SCRIPT ERROR:|Parse Error:' build/import.log; then
            echo "ERROR: Godot reported GDScript errors during import."
            exit 1
          fi
          echo "import exit code: $GODOT_STATUS"

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          sed -i 's|^gradle_build/min_sdk=.*|gradle_build/min_sdk=""|; s|^gradle_build/target_sdk=.*|gradle_build/target_sdk=""|' export_presets.cfg
          godot --headless --path . --export-debug "Android" build/Kazan_Ulitsy-debug.apk
          test -s build/Kazan_Ulitsy-debug.apk
          ls -lh build/Kazan_Ulitsy-debug.apk
          sha256sum build/Kazan_Ulitsy-debug.apk | tee build/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kazan-Ulitsy-Android-APK
          path: |
            ${{ steps.extract.outputs.project_dir }}/build/Kazan_Ulitsy-debug.apk
            ${{ steps.extract.outputs.project_dir }}/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
